<!--
  Supabase Auth → Email Templates → "Confirm signup"
  Paste the HTML below into the template body. Subject: אישור כתובת האימייל — רוויה
  Variable used: {{ .ConfirmationURL }}
-->
<div dir="rtl" style="margin:0;padding:0;background:#f5f8fa;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f8fa;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e2e9ed;border-radius:16px;overflow:hidden;font-family:'Segoe UI',Arial,Helvetica,sans-serif;">
          <tr>
            <td style="background:#14161A;padding:22px 28px;">
              <span style="color:#E8437B;font-size:20px;vertical-align:middle;">&#10022;</span>
              <span style="color:#ffffff;font-size:18px;font-weight:700;margin-inline-start:8px;vertical-align:middle;">רוויה</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 28px 8px;">
              <h1 style="margin:0 0 12px;font-size:22px;color:#12252c;font-weight:800;">כמעט שם! נשאר לאשר את האימייל</h1>
              <p style="margin:0 0 22px;font-size:15px;line-height:1.7;color:#42555c;">
                תודה שנרשמתם לרוויה. לחצו על הכפתור כדי לאשר את כתובת האימייל ולהתחיל לסדר את האירוע שלכם.
              </p>
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 24px;">
                <tr>
                  <td style="border-radius:10px;background:#D62E6B;">
                    <a href="{{ .ConfirmationURL }}" target="_blank"
                       style="display:inline-block;padding:13px 30px;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:10px;">
                      אישור האימייל &#8592;
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:0 0 6px;font-size:12.5px;line-height:1.6;color:#7a8b92;">
                אם הכפתור לא עובד, העתיקו את הקישור לדפדפן:
              </p>
              <p style="margin:0 0 4px;font-size:12px;line-height:1.5;color:#D62E6B;word-break:break-all;">
                {{ .ConfirmationURL }}
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 28px 26px;border-top:1px solid #eef2f4;">
              <p style="margin:0;font-size:12px;line-height:1.6;color:#9aa8ae;">
                לא נרשמתם? אפשר להתעלם מהמייל הזה בבטחה.<br>
                <span style="color:#E8437B;">&#10022;</span> רוויה — סידור הושבה חכם לאירועים
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
