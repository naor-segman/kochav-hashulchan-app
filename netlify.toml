[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"

# Per-event OG tags for every guest link the message sequence sends (WhatsApp
# previews). Until 28.9 only /invite/* was listed, so the other five previewed
# as the product. netlify/tests/invite-og.test.js fails if a route in the
# function's ROUTES table has no entry here.
[[edge_functions]]
  path     = "/invite/*"
  function = "invite-og"

[[edge_functions]]
  path     = "/rsvp/*"
  function = "invite-og"

[[edge_functions]]
  path     = "/invitation/*"
  function = "invite-og"

[[edge_functions]]
  path     = "/save-the-date/*"
  function = "invite-og"

[[edge_functions]]
  path     = "/card/*"
  function = "invite-og"

[[edge_functions]]
  path     = "/album/*"
  function = "invite-og"

[[edge_functions]]
  path     = "/gift/*"
  function = "invite-og"

# ── Per-route documents (checklist 87) ───────────────────────────────────────
# `seoPages()` in vite.config.js writes a real HTML file per indexable route,
# each with its own <title>, description and canonical. Netlify's pretty-URL
# handling would probably resolve /services/seating to that file on its own —
# but "probably", about the one stage of the deploy that never runs locally, is
# how eleven days of builds were lost here once. These rules make it explicit:
# first match wins, so they must stay ABOVE the SPA fallback below.
#
# A path missing from this list silently falls through to the generic
# index.html, which is exactly the bug being fixed and would look like it was
# still there. `netlify/tests/seoRoutes.test.js` fails when an entry in
# SEO_PAGES has no rule here.

[[redirects]]
  from   = "/services/*"
  to     = "/services/:splat/index.html"
  status = 200

[[redirects]]
  from   = "/home"
  to     = "/home/index.html"
  status = 200

[[redirects]]
  from   = "/pricing"
  to     = "/pricing/index.html"
  status = 200

[[redirects]]
  from   = "/help"
  to     = "/help/index.html"
  status = 200

[[redirects]]
  from   = "/terms"
  to     = "/terms/index.html"
  status = 200

[[redirects]]
  from   = "/refunds"
  to     = "/refunds/index.html"
  status = 200

[[redirects]]
  from   = "/privacy"
  to     = "/privacy/index.html"
  status = 200

[[redirects]]
  from   = "/accessibility"
  to     = "/accessibility/index.html"
  status = 200

# Everything else is the single-page app.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers (audit 28.9, A2) ────────────────────────────────────────
# Nothing was set before, so any site could frame the app (clickjacking a
# signed-in host into a delete), and every outbound link — Waze, maps,
# WhatsApp — sent the FULL guest URL as Referer, token included.
#
# frame-ancestors is 'self', not 'none': the site and invitation editors
# preview the real guest page in a same-origin <iframe>. 'none' breaks both.
# No Permissions-Policy: the door screen needs the camera for QR check-in.
# No full CSP yet — Supabase, Stripe, Google Analytics and Google Fonts would each need
# listing, and a wrong one blanks the app on the one stage that never runs here.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "strict-origin-when-cross-origin"

# ── Long cache for the hashed build output (סב58) ───────────────────────────
# Everything Vite writes to /assets/ carries a content hash in its name, so a
# given URL never changes content — a new build means a new name. Netlify's
# default is `max-age=0, must-revalidate`, which made every return visit
# revalidate ~100 chunks. NOT /fonts/ or anything else from public/: those keep
# their names across changes and must stay revalidated.
# netlify/tests/cacheHeaders.test.js fails if public/assets/ ever appears (an
# unhashed file there would be cached for a year under a name that can change).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
